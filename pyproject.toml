[project]
name = "zwift-komoot-synchronizer"
version = "0.1.0"
description = "macOS CLI to sync local Zwift rides to Komoot (FIT, title, photos)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fitparse>=1.2.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.scripts]
zwift-komoot = "zwift_komoot_sync.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
